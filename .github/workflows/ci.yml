name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    # Postgres 17 as a sidecar. Tests point at TEST_DATABASE_URL which
    # `packages/db/src/env.ts` picks up when NODE_ENV=test.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neuronexus
          POSTGRES_PASSWORD: neuronexus
          POSTGRES_DB: neuronexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuronexus -d neuronexus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus
      TEST_DATABASE_URL: postgres://neuronexus:neuronexus@localhost:5432/neuronexus_test
      BETTER_AUTH_SECRET: ci-secret-32chars-ci-secret-32chars
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      API_PORT: '3000'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Apply migrations against test DB
        run: bun run db:migrate:apply:test

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Production build — catches server-component / SSR regressions.
      - name: Build
        run: bun run build

      - name: Install Chromium for smoke
        run: bunx playwright install --with-deps chromium

      - name: Learner smoke
        run: bun run smoke:learner
