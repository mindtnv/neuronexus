name: Staging Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or SHA to deploy to staging
        required: false
        default: main
      rollback_db_on_failure:
        description: Restore the pre-release staging DB dump if smoke fails
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
      ROLLBACK_DB_ON_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_db_on_failure || 'false' }}
      STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR }}
      STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      SMOKE_API_BASE_URL: ${{ secrets.STAGING_API_URL }}
      SMOKE_WEB_BASE_URL: ${{ secrets.STAGING_WEB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install Chromium for smoke
        run: bunx playwright install --with-deps chromium

      - name: Prepare SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy staging candidate
        id: deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 "$STAGING_SSH_USER@$STAGING_SSH_HOST" <<EOF
          set -euo pipefail
          cd "$STAGING_APP_DIR"
          git fetch --prune origin "$DEPLOY_REF"
          bun run staging:deploy -- --ref FETCH_HEAD --env-file "$STAGING_ENV_FILE" --project-name neuronexus-staging
          EOF

      - name: Learner smoke against staging
        run: bun run smoke:learner

      - name: Roll back failed staging candidate
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          restore_flag=""
          if [ "$ROLLBACK_DB_ON_FAILURE" = "true" ]; then
            restore_flag="--restore-db"
          fi

          ssh -i ~/.ssh/id_ed25519 "$STAGING_SSH_USER@$STAGING_SSH_HOST" <<EOF
          set -euo pipefail
          cd "$STAGING_APP_DIR"
          bun run staging:rollback -- --env-file "$STAGING_ENV_FILE" --project-name neuronexus-staging $restore_flag
          EOF

      - name: Summary
        if: always()
        run: |
          {
            echo "## Staging deploy"
            echo
            echo "- ref: \`$DEPLOY_REF\`"
            echo "- deploy: \`${{ steps.deploy.outcome || 'skipped' }}\`"
            echo "- workflow result: \`${{ job.status }}\`"
            echo "- db restore on failure: \`$ROLLBACK_DB_ON_FAILURE\`"
          } >> "$GITHUB_STEP_SUMMARY"
