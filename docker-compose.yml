services:
  postgres:
    # pgvector/pgvector:pg17 = official Postgres 17 + the `vector` extension
    # available. The 0010_* migration / ensure-vector create the extension
    # per-DB; initdb does not. PG17→PG17 so the existing pgdata volume is reused.
    image: pgvector/pgvector:pg17
    container_name: neuronexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuronexus
      POSTGRES_PASSWORD: neuronexus
      POSTGRES_DB: neuronexus
      # Second DB created on first boot by /docker-entrypoint-initdb.d/init.sql
      POSTGRES_MULTIPLE_DATABASES: neuronexus_test
    ports:
      - '5432:5432'
    volumes:
      - neuronexus-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neuronexus -d neuronexus']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for field media (M2). Local dev only — prod
  # points the same S3_* env at Cloudflare R2 / AWS S3 with no code change.
  minio:
    image: minio/minio:latest
    container_name: neuronexus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: neuronexus
      MINIO_ROOT_PASSWORD: neuronexus-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - neuronexus-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the media bucket and make it public-read (download).
  # Stored <img> tokens resolve to ${S3_PUBLIC_BASE_URL}/media/<uuid>.
  createbuckets:
    image: minio/mc:latest
    container_name: neuronexus-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 neuronexus neuronexus-secret &&
      mc mb --ignore-existing local/neuronexus-media &&
      mc anonymous set download local/neuronexus-media &&
      echo 'bucket neuronexus-media ready (public-read)';
      "

volumes:
  neuronexus-pgdata:
  neuronexus-minio:
