<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1600"/>
<title>NeuroNexus — v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<style>
  html, body { height: 100%; background: #0a0b0d; }
  .nn-screen {
    width: 1320px; height: 820px; border-radius: 14px; overflow: hidden;
    display: flex; background: var(--bg); border: 1px solid var(--border-2);
    box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.2);
  }
  .nn-screen-wide { width: 1440px; }
  .tweaks-panel {
    position: fixed; bottom: 16px; right: 16px; width: 280px;
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: 12px; padding: 14px; z-index: 9999;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    font-family: var(--font-sans); color: var(--text);
    display: none; flex-direction: column; gap: 10px;
  }
  .tweaks-panel.on { display: flex; }
  .tweaks-panel .row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .tweaks-panel label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500; }
  .tweaks-panel select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 8px; border-radius: 6px; font-size: 12px; flex: 1; font-family: var(--font-sans); }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="frames/design-canvas.jsx"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="components/primitives.jsx"></script>
<script type="text/babel" src="components/shell.jsx"></script>
<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/review.jsx"></script>
<script type="text/babel" src="screens/graph.jsx"></script>
<script type="text/babel" src="screens/garden-decks-editor.jsx"></script>
<script type="text/babel" src="screens/mobile.jsx"></script>
<script type="text/babel" src="screens/extras.jsx"></script>
<script type="text/babel" src="screens/extras2.jsx"></script>
<script type="text/babel" src="components/command-palette.jsx"></script>
<script type="text/babel" src="screens/mobile-review.jsx"></script>
<script type="text/babel" src="components/ai-tutor.jsx"></script>
<script type="text/babel" src="components/kbd-cheatsheet.jsx"></script>
<script type="text/babel" src="screens/graph-hover.jsx"></script>

<div id="app"></div>

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "violet",
  "density": "default",
  "theme": "light"
}/*EDITMODE-END*/;
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const Frame = ({ label, children, wide }) => (
  <DCArtboard label={label} width={wide ? 1440 : 1320} height={820}>
    <div className={`nn-screen ${wide ? 'nn-screen-wide' : ''}`} style={{ width: '100%', height: '100%' }}>
      {children}
    </div>
  </DCArtboard>
);

const AppShell = ({ active, children }) => (
  <>
    <NNSidebar active={active} onNav={() => {}}/>
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, overflow: 'hidden' }}>
      {children}
    </div>
  </>
);

const App = () => {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') document.querySelector('.tweaks-panel')?.classList.add('on');
      if (e.data?.type === '__deactivate_edit_mode') document.querySelector('.tweaks-panel')?.classList.remove('on');
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setKey = (k, v) => {
    setTweaks(t => ({ ...t, [k]: v }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  return (
    <>
      <DesignCanvas>
        <div style={{ padding: '20px 60px 0', maxWidth: 900 }}>
          <div style={{
            fontFamily: 'Inter Tight, system-ui', fontSize: 11, fontWeight: 600,
            letterSpacing: 1.2, color: 'rgba(40,30,20,0.5)', textTransform: 'uppercase', marginBottom: 8,
          }}>NeuroNexus · v2 · final direction</div>
          <div style={{
            fontFamily: 'Instrument Serif, serif', fontSize: 48, lineHeight: 1.05,
            color: 'rgba(20,15,10,0.92)', letterSpacing: -1.2, marginBottom: 14,
          }}>
            Anki reimagined — graph, garden, AI.
          </div>
          <div style={{
            fontFamily: 'Inter Tight', fontSize: 15, lineHeight: 1.55,
            color: 'rgba(60,50,40,0.75)', maxWidth: 720,
          }}>
            Picked directions: <b>Review → Classic</b> (flip card with rich metadata and FSRS intervals),{' '}
            <b>Graph → Force-directed</b> (analytical, with side panel for selected node),{' '}
            <b>Garden → Terrarium</b> (one living scene that grows with your streak). Below — the full app
            with just the chosen variants.
          </div>
        </div>
        <div style={{ padding: '14px 60px', display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {['FSRS-5','Knowledge graph','Living terrarium','AI mnemonics','PDF → cards','Public API','Mobile + desktop'].map(t => (
            <span key={t} style={{
              padding: '5px 10px', fontSize: 11.5, background: 'rgba(40,30,20,0.06)',
              borderRadius: 999, color: 'rgba(40,30,20,0.7)', fontFamily: 'Inter Tight',
              border: '1px solid rgba(40,30,20,0.08)',
            }}>{t}</span>
          ))}
        </div>

        <DCSection title="01 · Home" subtitle="Dashboard — queue, streak + terrarium preview, activity, forecast, AI suggestions.">
          <Frame label="Desktop · Home">
            <AppShell active="home">
              <NNTopbar title="Home" subtitle="Welcome back, Alex"/>
              <NNHome/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="02 · Review" subtitle="Classic flip card with FSRS intervals, AI mnemonic inline, mic/image/sparkle shortcuts.">
          <Frame label="Review · Classic">
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="German vocab · 42 due"/>
              <NNReview variant="classic"/>
            </AppShell>
          </Frame>
          <DCPostIt top={-10} right={-140} rotate={3} width={200}>
            Space to reveal · 1-4 to grade · J/K to skip. Designed for keyboard flow.
          </DCPostIt>
        </DCSection>

        <DCSection title="03 · Knowledge graph" subtitle="Force-directed view. Click a node to see stats, linked cards, AI context in the side panel.">
          <Frame label="Graph · Force-directed">
            <AppShell active="graph">
              <NNTopbar title="Graph" subtitle="847 nodes · 2,103 links · 5 clusters"/>
              <NNGraph variant="force"/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="04 · Garden" subtitle="One terrarium — all your decks live here. Review waters the soil; streaks unlock new species.">
          <Frame label="Garden · Terrarium">
            <AppShell active="garden">
              <NNTopbar title="Garden" subtitle="Level 3 Botanist · 23-day streak"/>
              <NNGarden variant="terrarium"/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="05 · Library & Editor" subtitle="Deck management and AI-first card authoring.">
          <Frame label="Decks library">
            <AppShell active="decks">
              <NNTopbar title="Decks" subtitle="6 decks · 847 cards"/>
              <NNDecks/>
            </AppShell>
          </Frame>
          <Frame label="Card editor">
            <AppShell active="editor">
              <NNTopbar title="Editor" subtitle="der Nachbar · #342"/>
              <NNEditor/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="06 · Onboarding" subtitle="First-run flow. 4 steps · skippable · takes under a minute.">
          <Frame label="Onboarding · step 1 of 4">
            <NNOnboarding/>
          </Frame>
          <DCPostIt top={-10} right={-140} rotate={4} width={200}>
            Left sidebar tracks progress. Content fills the right two-thirds. Use arrows to step through — not shown, live demo needs interaction.
          </DCPostIt>
        </DCSection>

        <DCSection title="07 · Import · PDF → AI cards" subtitle="Drop a PDF, AI reads it, proposes cards, you approve. The killer feature vs. Anki.">
          <Frame wide label="Import · review generated cards">
            <AppShell active="decks">
              <NNTopbar title="Import" subtitle="B2_Modalverben.pdf · step 3 of 4"/>
              <NNImportPDF/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="08 · Stats & analytics" subtitle="Retention curve, grade distribution, per-deck health, forgetting curve, time-of-day heatmap.">
          <Frame wide label="Stats">
            <AppShell active="stats">
              <NNTopbar title="Stats" subtitle="Last 30 days · all decks"/>
              <NNStats/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="09 · Settings · FSRS tuning" subtitle="Fine-grained control without leaving the app. Desired retention, 19 weights, lapse steps, interleaving.">
          <Frame wide label="Settings · Algorithm">
            <AppShell active="settings">
              <NNTopbar title="Settings" subtitle="Algorithm · FSRS-5"/>
              <NNSettings/>
            </AppShell>
          </Frame>
          <DCPostIt top={20} left={-140} rotate={-5} width={200}>
            Pro users want to see the weights. Casual users can ignore this whole page — safe defaults.
          </DCPostIt>
        </DCSection>

        <DCSection title="10 · Mobile" subtitle="Companion app — same review flow, same graph, same terrarium.">
          <div style={{ display: 'flex', gap: 32 }}>
            <NNMobile/>
            <DCPostIt top={40} left={-40} rotate={-6} width={180}>
              Tap bottom tabs: Home / Review / Graph / Garden.
            </DCPostIt>
          </div>
        </DCSection>

        <DCSection title="11 · Card types" subtitle="Beyond basic front/back. Cloze deletions, image occlusion for visual material, type-to-answer for precision recall.">
          <Frame label="Cloze deletion">
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="History · cloze card"/>
              <NNCardTypes variant="cloze"/>
            </AppShell>
          </Frame>
          <Frame label="Image occlusion">
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="Anatomy · occlusion"/>
              <NNCardTypes variant="occlusion"/>
            </AppShell>
          </Frame>
          <Frame label="Type the answer">
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="German vocab · type mode"/>
              <NNCardTypes variant="type"/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="12 · Session complete" subtitle="The closing screen after review. Celebrates progress, shows what struggled, suggests next.">
          <Frame wide label="Session complete">
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="German vocab · session finished"/>
              <NNSessionComplete/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="13 · Achievements" subtitle="Badges grouped by streaks, garden, mastery, time. Earned glow · locked fade · progress bars for the in-progress ones.">
          <Frame wide label="Achievements">
            <AppShell active="stats">
              <NNTopbar title="Achievements" subtitle="9 of 17 badges · Level 3 Botanist"/>
              <NNAchievements/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="14 · Leagues & friends" subtitle="Duolingo-style weekly league. Top 3 promote, bottom 2 demote. Right rail — friends presence + challenges.">
          <Frame wide label="Leagues · Sapling">
            <AppShell active="stats">
              <NNTopbar title="Leagues" subtitle="Sapling league · week 14"/>
              <NNLeagues/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="15 · Empty states" subtitle="The often-forgotten 30% of a new user's experience.">
          <Frame label="First run · no decks">
            <AppShell active="home">
              <NNTopbar title="Home" subtitle="Welcome to NeuroNexus"/>
              <NNEmpty kind="first-run"/>
            </AppShell>
          </Frame>
          <Frame label="Nothing due · inbox zero">
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="All caught up"/>
              <NNEmpty kind="done"/>
            </AppShell>
          </Frame>
          <Frame label="Graph · not enough data">
            <AppShell active="graph">
              <NNTopbar title="Graph" subtitle="6 nodes · building"/>
              <NNEmpty kind="graph"/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="16 · AI Tutor" subtitle="⌘+sparkle opens a side-drawer with real AI responses contextual to the current card.">
          <Frame wide label="Review · AI Tutor open">
            <AppShell active="review">
              <NNReviewWithTutor/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="17 · Graph · node hover" subtitle="Hover any highlighted node → mini-card preview with front/back, mastery bar, link count.">
          <Frame wide label="Graph · hover preview">
            <AppShell active="graph">
              <NNTopbar title="Graph" subtitle="847 nodes · 2,103 links · 5 clusters"/>
              <NNGraphWithHover/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="18 · Keyboard cheatsheet" subtitle="Press ? anywhere to open grouped shortcut reference. Keyboard-first UX signal.">
          <Frame wide label="Cheatsheet overlay">
            <AppShell active="review">
              <NNKbdCheatsheetDemo/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="19 · Command palette" subtitle="⌘K — universal search across cards, decks, graph nodes + quick actions. Keyboard-first.">
          <Frame label="Command palette · empty state">
            <AppShell active="home">
              <NNCmdPaletteDemo query=""/>
            </AppShell>
          </Frame>
          <Frame label="Command palette · search 'german'">
            <AppShell active="home">
              <NNCmdPaletteDemo query="german"/>
            </AppShell>
          </Frame>
        </DCSection>

        <DCSection title="20 · Mobile review · detail" subtitle="Swipe-to-grade gestures, haptic ripple feedback, mic voice answer, full-screen card flow.">
          <NNMobileReviewDetail/>
        </DCSection>

        <div style={{ height: 60 }}/>
      </DesignCanvas>

      <div className="tweaks-panel">
        <div style={{ fontSize: 13, fontWeight: 600 }}>Tweaks</div>
        <div style={{ fontSize: 11, color: 'var(--text-dim)' }}>Visual tuning for the chosen direction.</div>
        <div className="row">
          <label style={{ width: 70 }}>Theme</label>
          <select value={tweaks.theme} onChange={e => { setKey('theme', e.target.value); applyTheme(e.target.value); }}>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        <div className="row">
          <label style={{ width: 70 }}>Accent</label>
          <select value={tweaks.accentColor} onChange={e => { setKey('accentColor', e.target.value); applyAccent(e.target.value); }}>
            <option value="lime">Lime (default)</option>
            <option value="violet">Violet</option>
            <option value="amber">Amber</option>
            <option value="sky">Sky</option>
          </select>
        </div>
        <div className="row">
          <label style={{ width: 70 }}>Density</label>
          <select value={tweaks.density} onChange={e => setKey('density', e.target.value)}>
            <option value="default">Default</option>
            <option value="compact">Compact</option>
          </select>
        </div>
      </div>
    </>
  );
};

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : '');
}

function applyAccent(c) {
  const map = { lime: '#9ad155', violet: '#a788ff', amber: '#f3b655', sky: '#55c4d6' };
  document.documentElement.style.setProperty('--lime-400', map[c]);
  document.documentElement.style.setProperty('--lime-500', map[c]);
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
