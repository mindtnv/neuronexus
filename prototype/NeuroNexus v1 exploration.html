<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1600"/>
<title>NeuroNexus — design exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<style>
  html, body { height: 100%; background: #0a0b0d; }
  /* Screen frame — desktop app chrome */
  .nn-screen {
    width: 1320px; height: 820px; border-radius: 14px; overflow: hidden;
    display: flex; background: var(--bg); border: 1px solid var(--border-2);
    box-shadow: 0 40px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.2);
  }
  .nn-screen-wide { width: 1440px; }
  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; bottom: 16px; right: 16px; width: 280px;
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: 12px; padding: 14px; z-index: 9999;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    font-family: var(--font-sans); color: var(--text);
    display: none; flex-direction: column; gap: 10px;
  }
  .tweaks-panel.on { display: flex; }
  .tweaks-panel .row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .tweaks-panel label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 500; }
  .tweaks-panel select, .tweaks-panel input[type=text] {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 8px; border-radius: 6px; font-size: 12px; flex: 1;
    font-family: var(--font-sans);
  }
</style>
</head>
<body>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="frames/design-canvas.jsx"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="components/primitives.jsx"></script>
<script type="text/babel" src="components/shell.jsx"></script>
<script type="text/babel" src="screens/home.jsx"></script>
<script type="text/babel" src="screens/review.jsx"></script>
<script type="text/babel" src="screens/graph.jsx"></script>
<script type="text/babel" src="screens/garden-decks-editor.jsx"></script>
<script type="text/babel" src="screens/mobile.jsx"></script>

<div id="app"></div>

<!-- Tweaks defaults — persisted on disk -->
<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "reviewVariant": "classic",
  "graphVariant": "force",
  "gardenVariant": "grid",
  "accentColor": "lime",
  "theme": "dark"
}/*EDITMODE-END*/;
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const Frame = ({ label, subtitle, children, wide }) => (
  <DCArtboard label={label} width={wide ? 1440 : 1320} height={820}>
    <div className={`nn-screen ${wide ? 'nn-screen-wide' : ''}`} style={{ width: '100%', height: '100%' }}>
      {children}
    </div>
    {subtitle && (
      <div style={{ position: 'absolute', top: -28, left: 0, color: 'rgba(60,50,40,0.45)', fontSize: 11 }}>
        {subtitle}
      </div>
    )}
  </DCArtboard>
);

const AppShell = ({ active, children }) => (
  <>
    <NNSidebar active={active} onNav={() => {}}/>
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, overflow: 'hidden' }}>
      {children}
    </div>
  </>
);

const App = () => {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') {
        document.querySelector('.tweaks-panel')?.classList.add('on');
      }
      if (e.data?.type === '__deactivate_edit_mode') {
        document.querySelector('.tweaks-panel')?.classList.remove('on');
      }
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setKey = (k, v) => {
    setTweaks(t => ({ ...t, [k]: v }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  return (
    <>
      <DesignCanvas>
        {/* ─────────────────── INTRO ─────────────────── */}
        <div style={{ padding: '20px 60px 0', maxWidth: 900 }}>
          <div style={{
            fontFamily: 'Inter Tight, system-ui', fontSize: 11, fontWeight: 600,
            letterSpacing: 1.2, color: 'rgba(40,30,20,0.5)', textTransform: 'uppercase', marginBottom: 8,
          }}>NeuroNexus · v0 exploration</div>
          <div style={{
            fontFamily: 'Instrument Serif, serif', fontSize: 48, lineHeight: 1.05,
            color: 'rgba(20,15,10,0.92)', letterSpacing: -1.2, marginBottom: 14,
          }}>
            An Anki replacement that's a garden, a graph, and a gym for your brain.
          </div>
          <div style={{
            fontFamily: 'Inter Tight', fontSize: 15, lineHeight: 1.55,
            color: 'rgba(60,50,40,0.75)', maxWidth: 720,
          }}>
            Keep Anki's SRS (FSRS-5 under the hood) and its complete deck/tag/card model, but rebuild the
            surface around three ideas: <b>a knowledge graph</b> that shows what connects to what,
            <b> a living garden</b> that makes the streak feel like something you want to protect, and
            <b> AI as a first-class citizen</b> — inline mnemonics, auto-links, PDF → cards, open-ended drills.
            Dark, warm, dense — closer to Linear than Duolingo.
          </div>
        </div>
        <div style={{ padding: '14px 60px', display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {['FSRS-5 SRS','Knowledge graph','Garden gamification','AI mnemonics','PDF → cards','Context-aware links','Public API','Mobile + desktop'].map(t => (
            <span key={t} style={{
              padding: '5px 10px', fontSize: 11.5, background: 'rgba(40,30,20,0.06)',
              borderRadius: 999, color: 'rgba(40,30,20,0.7)', fontFamily: 'Inter Tight',
              border: '1px solid rgba(40,30,20,0.08)',
            }}>{t}</span>
          ))}
        </div>

        {/* ─────────────────── HOME ─────────────────── */}
        <DCSection title="01 · Home / Dashboard" subtitle="Main landing — what's due, streak status, forecast, AI suggestions, knowledge graph peek.">
          <Frame label="Desktop · Home">
            <AppShell active="home">
              <NNTopbar title="Home" subtitle="Welcome back, Alex"/>
              <NNHome/>
            </AppShell>
          </Frame>
          <DCPostIt top={-10} left={-140} rotate={-4} width={180}>
            The "42 due" hero is the single most important surface — everything else defers to it.
          </DCPostIt>
        </DCSection>

        {/* ─────────────────── REVIEW ─────────────────── */}
        <DCSection title="02 · Review session · 3 variants" subtitle="The core interaction. Same SRS engine, three different densities.">
          <Frame label="A · Classic — flip card + rich metadata">
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="German vocab · 42 due"/>
              <NNReview variant="classic"/>
            </AppShell>
          </Frame>
          <Frame label="B · Focus — zen fullscreen mode">
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="Focus mode"/>
              <NNReview variant="focus"/>
            </AppShell>
          </Frame>
          <Frame label="C · Context — card + live graph + related cards" wide>
            <AppShell active="review">
              <NNTopbar title="Review" subtitle="With graph context"/>
              <NNReview variant="context"/>
            </AppShell>
          </Frame>
          <DCPostIt top={-10} right={-140} rotate={3} width={200}>
            FSRS intervals visible on each grade button — "next in 3d" beats guessing.
          </DCPostIt>
        </DCSection>

        {/* ─────────────────── GRAPH ─────────────────── */}
        <DCSection title="03 · Knowledge graph · 3 variants" subtitle="Your cards visualized as a living brain. Choose vibe.">
          <Frame label="A · Force-directed — analytical">
            <AppShell active="graph">
              <NNTopbar title="Graph" subtitle="847 nodes · 2,103 links"/>
              <NNGraph variant="force"/>
            </AppShell>
          </Frame>
          <Frame label="B · Constellation — poetic">
            <AppShell active="graph">
              <NNTopbar title="Graph" subtitle="Constellation view"/>
              <NNGraph variant="constellation"/>
            </AppShell>
          </Frame>
          <Frame label="C · Clusters — grouped bubble view">
            <AppShell active="graph">
              <NNTopbar title="Graph" subtitle="Clusters"/>
              <NNGraph variant="clusters"/>
            </AppShell>
          </Frame>
        </DCSection>

        {/* ─────────────────── GARDEN ─────────────────── */}
        <DCSection title="04 · Garden · 2 variants" subtitle="Gamification you won't be embarrassed to open at work.">
          <Frame label="A · Grid — deck-per-plot">
            <AppShell active="garden">
              <NNTopbar title="Garden" subtitle="Level 3 Botanist"/>
              <NNGarden variant="grid"/>
            </AppShell>
          </Frame>
          <Frame label="B · Terrarium — single living scene">
            <AppShell active="garden">
              <NNTopbar title="Garden" subtitle="Terrarium view"/>
              <NNGarden variant="terrarium"/>
            </AppShell>
          </Frame>
        </DCSection>

        {/* ─────────────────── DECKS + EDITOR ─────────────────── */}
        <DCSection title="05 · Library & Editor" subtitle="Where you manage decks and build cards.">
          <Frame label="Decks library">
            <AppShell active="decks">
              <NNTopbar title="Decks" subtitle="6 decks · 847 cards"/>
              <NNDecks/>
            </AppShell>
          </Frame>
          <Frame label="Card editor — AI-first">
            <AppShell active="editor">
              <NNTopbar title="Editor" subtitle="der Nachbar · #342"/>
              <NNEditor/>
            </AppShell>
          </Frame>
        </DCSection>

        {/* ─────────────────── MOBILE ─────────────────── */}
        <DCSection title="06 · Mobile" subtitle="Adaptive companion — home, review, graph, garden.">
          <div style={{ display: 'flex', gap: 32 }}>
            <NNMobile/>
            <DCPostIt top={40} left={-40} rotate={-6} width={180}>
              Tap the bottom tabs to switch between Home / Review / Graph / Garden.
            </DCPostIt>
          </div>
        </DCSection>

        <div style={{ height: 60 }}/>
      </DesignCanvas>

      {/* Tweaks panel */}
      <div className="tweaks-panel">
        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>Tweaks</div>
        <div style={{ fontSize: 11, color: 'var(--text-dim)', marginBottom: 4 }}>
          Defaults for variant switchers. Scroll canvas to see variants side-by-side regardless.
        </div>
        <div className="row">
          <label style={{ width: 70 }}>Review</label>
          <select value={tweaks.reviewVariant} onChange={e => setKey('reviewVariant', e.target.value)}>
            <option value="classic">Classic</option>
            <option value="focus">Focus</option>
            <option value="context">Context</option>
          </select>
        </div>
        <div className="row">
          <label style={{ width: 70 }}>Graph</label>
          <select value={tweaks.graphVariant} onChange={e => setKey('graphVariant', e.target.value)}>
            <option value="force">Force-directed</option>
            <option value="constellation">Constellation</option>
            <option value="clusters">Clusters</option>
          </select>
        </div>
        <div className="row">
          <label style={{ width: 70 }}>Garden</label>
          <select value={tweaks.gardenVariant} onChange={e => setKey('gardenVariant', e.target.value)}>
            <option value="grid">Grid</option>
            <option value="terrarium">Terrarium</option>
          </select>
        </div>
        <div className="row">
          <label style={{ width: 70 }}>Accent</label>
          <select value={tweaks.accentColor} onChange={e => { setKey('accentColor', e.target.value); applyAccent(e.target.value); }}>
            <option value="lime">Lime (default)</option>
            <option value="violet">Violet</option>
            <option value="amber">Amber</option>
            <option value="sky">Sky</option>
          </select>
        </div>
      </div>
    </>
  );
};

function applyAccent(c) {
  const map = {
    lime: '#9ad155', violet: '#a788ff', amber: '#f3b655', sky: '#55c4d6',
  };
  document.documentElement.style.setProperty('--lime-400', map[c]);
  document.documentElement.style.setProperty('--lime-500', map[c]);
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
